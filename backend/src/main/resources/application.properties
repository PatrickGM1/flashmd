server.port=8080
spring.application.name=flashmd-backend
management.endpoints.web.exposure.include=health
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# auth
# error responses carry the reason ("Password needs at least 8 characters"), not just a status
server.error.include-message=always
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
# cookie outlives the browser; the server session decides how long it stays valid (see AuthController)
server.servlet.session.cookie.max-age=30d
server.servlet.session.timeout=12h
# keep sessions across restarts, next to the decks
server.servlet.session.persistent=true
server.servlet.session.store-dir=${FLASHMD_SESSION_DIR:data/sessions}
flashmd.admin-user=${FLASHMD_ADMIN_USER:admin}
flashmd.admin-password=${FLASHMD_ADMIN_PASSWORD:admin}
flashmd.registration=${FLASHMD_REGISTRATION:true}
