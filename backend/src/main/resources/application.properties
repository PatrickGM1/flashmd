server.port=8080
spring.application.name=flashmd-backend
management.endpoints.web.exposure.include=health
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# auth: stateless JWT in an httpOnly cookie, see com.flashmd.auth
# error responses carry the reason ("Password needs at least 8 characters"), not just a status
server.error.include-message=always
# behind nginx / an ingress: trust X-Forwarded-Proto so the cookie gets the Secure flag on https
server.forward-headers-strategy=native
flashmd.admin-user=${FLASHMD_ADMIN_USER:admin}
flashmd.admin-password=${FLASHMD_ADMIN_PASSWORD:admin}
flashmd.registration=${FLASHMD_REGISTRATION:true}
# optional: set your own signing secret (32+ random chars); otherwise one is generated into data/jwt.secret
flashmd.jwt-secret=${FLASHMD_JWT_SECRET:}
