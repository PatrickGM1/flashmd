<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="flashmd — spaced-repetition flashcards from plain markdown." />
    <meta name="theme-color" content="#c9dbc5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#143627" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta property="og:title" content="flashmd" />
    <meta property="og:description" content="Spaced-repetition flashcards from a plain markdown file." />
    <meta property="og:image" content="/logo.svg" />
    <title>flashmd</title>
    <link rel="preload" href="/fonts/Barlow-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/BarlowCondensed-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <script>
      try {
        var m = localStorage.getItem("flashmd-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.style.colorScheme = m;
        document.documentElement.style.background = m === "dark" ? "#143627" : "#c9dbc5";
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
