<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- flashmd: a pair of playing cards; the back card wears a Bicycle-blue lattice,
       the front card's suit is a lightning bolt -->
  <defs>
    <pattern id="lattice" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 3H6M3 0V6" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
    </pattern>
    <clipPath id="backclip"><rect x="14.5" y="10.5" width="27" height="37" rx="2"/></clipPath>
  </defs>

  <!-- back card, fanned behind -->
  <g transform="rotate(-14 28 31)">
    <rect x="11" y="7" width="34" height="44" rx="4" fill="#ffffff"/>
    <rect x="11" y="7" width="34" height="44" rx="4" stroke="#0d3b8f" stroke-width="1.5" opacity="0.35"/>
    <rect x="14.5" y="10.5" width="27" height="37" rx="2" fill="#0d3b8f"/>
    <rect x="14.5" y="10.5" width="27" height="37" rx="2" fill="url(#lattice)" clip-path="url(#backclip)"/>
    <rect x="14.5" y="10.5" width="27" height="37" rx="2" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- front card -->
  <g transform="rotate(6 36 36)">
    <rect x="19" y="13" width="34" height="44" rx="4" fill="#ffffff"/>
    <rect x="19.75" y="13.75" width="32.5" height="42.5" rx="3.25" stroke="#c8102e" stroke-width="1.5" opacity="0.25"/>
    <!-- corner indices: the flash -->
    <path d="M25 18.5 L22.6 24.2 H24.7 L23.4 28.6 L27.5 22.2 H25.3 L26.6 18.5 Z" fill="#c8102e"/>
    <path d="M47 51.5 L49.4 45.8 H47.3 L48.6 41.4 L44.5 47.8 H46.7 L45.4 51.5 Z" fill="#c8102e"/>
    <!-- center pip -->
    <path d="M38.5 24 L31 37.5 H36.3 L33.4 47 L44.5 32.5 H38.9 L41.5 24 Z" fill="#c8102e"/>
  </g>
</svg>
